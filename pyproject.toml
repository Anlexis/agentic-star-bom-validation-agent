[project]
name = "mfg-c2-012"
version = "0.1.0"
description = "ManufacturingBOMValidationAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by the CI environment (installed from the package registry).
# Pinning it here would make `pip install -e .` fail because it is not
# resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/examples/"]
# The published agenticstar-agentcore wheel ships no py.typed marker, so
# framework.* / shared.* imports resolve to Any — which makes every required
# framework subclass an [import-untyped] / "subclass of Any" error. All other
# strict settings stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# State extends the framework's AgentState TypedDict. That is correct at
# runtime, but with the untyped wheel AgentState resolves to Any, so mypy
# cannot see the TypedDict base and mis-flags every field declaration.
# Silence only that diagnostic, only for the state module.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
